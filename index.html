<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRA ZOOM RAW | محرك دمج اللقطات الفائق</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f2fe;
      --green: #10b981;
      --amber: #f59e0b;
      --dark: #05070b;
      --panel: rgba(8, 12, 20, 0.96);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* شاشة الرصد المباشرة (بدون تمطيط CSS) */
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* الفيديو مخفي لأننا نرسم على لوحة عالية الدقة مباشرة */
    video {
      display: none;
    }

    #viewCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* الشريط العلوي */
    .top-hud {
      position: absolute;
      top: 12px;
      right: 12px;
      left: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      gap: 8px;
    }

    .hud-badge {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 242, 254, 0.4);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lens-select {
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      outline: none;
    }

    .zoom-readout {
      font-size: 1rem;
      font-weight: 900;
      color: var(--amber);
      background: rgba(0, 0, 0, 0.8);
      border: 1.5px solid var(--amber);
      padding: 3px 12px;
      border-radius: 10px;
    }

    /* نافذة الرادار المصغرة عند التقريب العالي (PIP) */
    .pip-box {
      position: absolute;
      top: 56px;
      left: 12px;
      width: 90px;
      height: 120px;
      border: 1.5px solid var(--cyan);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      z-index: 20;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    #pipCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* مؤشر التقدم أثناء دمج اللقطات */
    .stack-loader {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 242, 254, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* أزرار التقريب السريع */
    .quick-zoom-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px;
      padding: 4px 6px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    .qz-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
    }

    .qz-btn.active {
      background: var(--cyan);
      color: #000;
    }

    /* لوحة التحكم السفلية */
    .control-deck {
      background: var(--panel);
      border-top: 1px solid rgba(0, 242, 254, 0.25);
      padding: 10px 14px 16px;
      z-index: 30;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .slider-row span {
      font-size: 0.72rem;
      color: #94a3b8;
      width: 52px;
      font-weight: 700;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--cyan);
      height: 5px;
    }

    /* أزرار الالتقاط */
    .shutter-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-top: 8px;
    }

    .shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid var(--cyan);
      background: rgba(0, 242, 254, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    .shutter-inner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--cyan);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 0.65rem;
      line-height: 1.1;
    }

    .shutter-inner i { font-size: 1.1rem; }

    .side-btn {
      padding: 8px 12px;
      border-radius: 12px;
      background: #141c2b;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .side-btn.active {
      border-color: var(--green);
      color: var(--green);
    }

    /* نافذة النتيجة النهائية */
    .result-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 500;
      display: none;
      flex-direction: column;
      padding: 14px;
    }

    .result-img-wrap {
      flex: 1;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }

    .result-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .act-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="viewCanvas"></canvas>

    <!-- شاشة الرادار المصغرة لمعرفة مكان الهدف -->
    <div class="pip-box" id="pipBox">
      <canvas id="pipCanvas" width="180" height="240"></canvas>
    </div>

    <!-- مؤشر معالجة ودمج اللقطات -->
    <div class="stack-loader" id="stackLoader">
      <div class="spinner"></div>
      <div style="font-weight:800; color:var(--cyan); font-size:0.9rem;" id="stackStatus">جاري دمج 8 لقطات لإزالة الغباش...</div>
      <small style="color:#94a3b8; font-size:0.75rem;">أبقِ يدك ثابتة لجزء من الثانية</small>
    </div>

    <div class="top-hud">
      <div class="hud-badge">
        <i class="fas fa-layer-group"></i>
        <span id="resBadge">RAW ENGINE</span>
      </div>

      <!-- قائمة اختيار العدسة الخلفية (للوصول لعدسة الـ Telephoto مباشرة) -->
      <select id="lensSelect" class="lens-select" onchange="switchLens(this.value)">
        <option value="">العدسة الأساسية</option>
      </select>

      <div class="zoom-readout" id="zoomLabel">1.0X</div>
    </div>

    <!-- أزرار التقريب المنطقي -->
    <div class="quick-zoom-bar">
      <button class="qz-btn active" onclick="setZoom(1, this)">1x</button>
      <button class="qz-btn" onclick="setZoom(2, this)">2x</button>
      <button class="qz-btn" onclick="setZoom(4, this)">4x</button>
      <button class="qz-btn" onclick="setZoom(8, this)">8x</button>
      <button class="qz-btn" onclick="setZoom(12, this)">12x</button>
      <button class="qz-btn" onclick="setZoom(16, this)">16x</button>
    </div>
  </div>

  <!-- لوحة التحكم الدقيقة -->
  <div class="control-deck">
    <div class="slider-row">
      <span>التقريب</span>
      <input type="range" id="zoomSlider" min="1" max="16" step="0.1" value="1" oninput="handleSliderZoom(this.value)">
    </div>

    <div class="slider-row">
      <span>التعريض</span>
      <input type="range" id="expSlider" min="-100" max="100" step="5" value="0" oninput="applyExposure(this.value)">
    </div>

    <div class="slider-row">
      <span>الحدة</span>
      <input type="range" id="sharpSlider" min="0" max="100" value="55">
    </div>

    <div class="shutter-row">
      <button class="side-btn" id="denoiseToggle" onclick="toggleMode(this)">
        <i class="fas fa-broom"></i> مانع غباش ليلي: مفعل
      </button>

      <!-- زر التصوير بدمج 8 إطارات (Super-Resolution Burst) -->
      <div class="shutter-btn" onclick="captureMultiFrameStack()">
        <div class="shutter-inner">
          <i class="fas fa-camera"></i>
          <span>8X HDR</span>
        </div>
      </div>

      <button class="side-btn" onclick="reFocus()">
        <i class="fas fa-bullseye" style="color:var(--cyan);"></i> تركيز الفوكس
      </button>
    </div>
  </div>

  <!-- نافذة عرض الصورة المعالجة -->
  <div class="result-modal" id="resultModal">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
      <h4 style="color:var(--cyan); font-size:0.9rem;"><i class="fas fa-check-circle"></i> نتيجة الدمج الفائق (8 إطارات + شحذ ذكي)</h4>
    </div>
    <div class="result-img-wrap">
      <img id="finalImage" alt="Processed">
    </div>
    <div class="result-actions">
      <button class="act-btn" style="background:var(--cyan); color:#000;" onclick="downloadImg()">
        <i class="fas fa-download"></i> حفظ الصورة الصافية
      </button>
      <button class="act-btn" style="background:#1e293b; color:#fff;" onclick="document.getElementById('resultModal').style.display='none'">
        <i class="fas fa-redo"></i> إغلاق
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const viewCanvas = document.getElementById('viewCanvas');
    const viewCtx = viewCanvas.getContext('2d', { alpha: false });
    const pipCanvas = document.getElementById('pipCanvas');
    const pipCtx = pipCanvas.getContext('2d', { alpha: false });

    let stream = null;
    let videoTrack = null;
    let currentZoom = 1;
    let hwMaxZoom = 1;
    let denoiseActive = true;
    let exposureMod = 0;
    let currentDeviceId = null;

    // 1. استكشاف جميع الكاميرات الخلفية (لإتاحة اختيار عدسة الزوم Telephoto إن وجدت)
    async function loadBackLenses() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backCams = devices.filter(d => d.kind === 'videoinput' && (d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment') || d.label === ''));
        const select = document.getElementById('lensSelect');
        if (backCams.length > 1) {
          select.innerHTML = '';
          backCams.forEach((cam, idx) => {
            const opt = document.createElement('option');
            opt.value = cam.deviceId;
            opt.textContent = `عدسة خلفية (${idx + 1})`;
            select.appendChild(opt);
          });
        }
      } catch (e) {}
    }

    // 2. تشغيل الكاميرا بأعلى دقة خام ممكنة للحساس
    async function startCamera(deviceId = null) {
      if (stream) stream.getTracks().forEach(t => t.stop());

      const videoConstraints = {
        width: { ideal: 4096 },
        height: { ideal: 2160 },
        frameRate: { ideal: 30 }
      };

      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: 'environment' };
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = stream;
        await video.play();

        videoTrack = stream.getVideoTracks()[0];
        const settings = videoTrack.getSettings();
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

        if (caps.zoom) {
          hwMaxZoom = caps.zoom.max;
        }

        // تفعيل التركيز المستمر التلقائي
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }

        document.getElementById('resBadge').textContent = `${settings.width || 1920}×${settings.height || 1080} RAW`;
        loadBackLenses();
        requestAnimationFrame(renderViewfinder);
      } catch (err) {
        alert("يرجى السماح بالوصول للكاميرا.");
      }
    }

    function switchLens(devId) {
      if (devId) startCamera(devId);
    }

    // 3. محرك عرض حي نقي بدون تمطيط CSS
    function renderViewfinder() {
      if (video.readyState >= 2) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        if (viewCanvas.width !== vw || viewCanvas.height !== vh) {
          viewCanvas.width = vw;
          viewCanvas.height = vh;
        }

        // حساب الجزء المقرب المتبقي بعد زوم الهاردوير
        let softZoom = currentZoom;
        if (hwMaxZoom > 1) {
          softZoom = currentZoom / Math.min(currentZoom, hwMaxZoom);
        }

        const cropW = vw / softZoom;
        const cropH = vh / softZoom;
        const cropX = (vw - cropW) / 2;
        const cropY = (vh - cropH) / 2;

        viewCtx.imageSmoothingEnabled = true;
        viewCtx.imageSmoothingQuality = 'high';

        // تطبيق تعديل السطوع/التعريض
        if (exposureMod !== 0) {
          const b = 1 + (exposureMod / 200);
          viewCtx.filter = `brightness(${b}) contrast(1.08)`;
        } else {
          viewCtx.filter = 'none';
        }

        viewCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, vw, vh);

        // عرض نافذة الرادار (PIP) إذا كان الزوم فوق 3x لمساعدتك على تثبيت الهدف
        const pipBox = document.getElementById('pipBox');
        if (currentZoom >= 3) {
          pipBox.style.display = 'block';
          pipCtx.drawImage(video, 0, 0, pipCanvas.width, pipCanvas.height);
          pipCtx.strokeStyle = '#00f2fe';
          pipCtx.lineWidth = 2;
          const rx = (cropX / vw) * pipCanvas.width;
          const ry = (cropY / vh) * pipCanvas.height;
          const rw = (cropW / vw) * pipCanvas.width;
          const rh = (cropH / vh) * pipCanvas.height;
          pipCtx.strokeRect(rx, ry, rw, rh);
        } else {
          pipBox.style.display = 'none';
        }
      }
      requestAnimationFrame(renderViewfinder);
    }

    // 4. التحكم بالتقريب والتعريض والفوكس
    function applyZoom(val) {
      currentZoom = parseFloat(val);
      document.getElementById('zoomLabel').textContent = currentZoom.toFixed(1) + 'X';
      document.getElementById('zoomSlider').value = currentZoom;

      if (videoTrack && hwMaxZoom > 1) {
        const targetHw = Math.min(currentZoom, hwMaxZoom);
        videoTrack.applyConstraints({ advanced: [{ zoom: targetHw }] }).catch(() => {});
      }
    }

    function setZoom(val, btn) {
      document.querySelectorAll('.qz-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyZoom(val);
    }

    function handleSliderZoom(val) {
      document.querySelectorAll('.qz-btn').forEach(b => b.classList.remove('active'));
      applyZoom(val);
    }

    function applyExposure(val) {
      exposureMod = parseFloat(val);
      if (videoTrack && videoTrack.getCapabilities) {
        const caps = videoTrack.getCapabilities();
        if (caps.exposureCompensation) {
          const min = caps.exposureCompensation.min;
          const max = caps.exposureCompensation.max;
          const mapped = min + ((exposureMod + 100) / 200) * (max - min);
          videoTrack.applyConstraints({ advanced: [{ exposureCompensation: mapped }] }).catch(() => {});
        }
      }
    }

    function reFocus() {
      if (!videoTrack) return;
      videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).then(() => {
        setTimeout(() => {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }, 600);
      }).catch(() => {});
    }

    function toggleMode(btn) {
      denoiseActive = !denoiseActive;
      btn.classList.toggle('active', denoiseActive);
      btn.innerHTML = `<i class="fas fa-broom"></i> مانع غباش ليلي: ${denoiseActive ? 'مفعل' : 'متوقف'}`;
    }

    // 5. التقنية الأهم: التقاط ودمج 8 لقطات متتالية (Multi-Frame Super-Resolution Stacking)
    async function captureMultiFrameStack() {
      const loader = document.getElementById('stackLoader');
      const statusText = document.getElementById('stackStatus');
      loader.style.display = 'flex';

      const vw = viewCanvas.width || 1920;
      const vh = viewCanvas.height || 1080;

      const workCanvas = document.createElement('canvas');
      workCanvas.width = vw;
      workCanvas.height = vh;
      const workCtx = workCanvas.getContext('2d');

      const totalFrames = denoiseActive ? 8 : 1;
      let accBuffer = new Float32Array(vw * vh * 4);

      for (let f = 0; f < totalFrames; f++) {
        statusText.textContent = `جاري سحب ودمج الإطار (${f + 1} من ${totalFrames})...`;
        workCtx.drawImage(viewCanvas, 0, 0, vw, vh);
        const frameData = workCtx.getImageData(0, 0, vw, vh).data;

        for (let i = 0; i < frameData.length; i++) {
          accBuffer[i] += frameData[i];
        }
        await new Promise(r => setTimeout(r, 45));
      }

      statusText.textContent = "تطبيق معالجة الحدة الذكية (Unsharp Mask)...";
      await new Promise(r => setTimeout(r, 50));

      const finalImgData = workCtx.createImageData(vw, vh);
      const outPixels = finalImgData.data;
      for (let i = 0; i < outPixels.length; i++) {
        outPixels[i] = accBuffer[i] / totalFrames;
      }
      workCtx.putImageData(finalImgData, 0, 0);

      // تطبيق شحذ الحواف الذكي بدون تضخيم النمش (Thresholded Unsharp Mask)
      const sharpAmount = parseInt(document.getElementById('sharpSlider').value) / 100;
      if (sharpAmount > 0) {
        applySmartUnsharpMask(workCtx, vw, vh, sharpAmount);
      }

      loader.style.display = 'none';
      document.getElementById('finalImage').src = workCanvas.toDataURL('image/jpeg', 0.98);
      document.getElementById('resultModal').style.display = 'flex';
    }

    // خوارزمية شحذ احترافية تشحذ الحواف الحقيقية فقط وتتجاهل النمش الخلفي (Thresholding)
    function applySmartUnsharpMask(ctx, w, h, amount) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const src = imgData.data;
      const copy = new Uint8ClampedArray(src);
      const threshold = 10; // يتجاهل النمش الصغير ويشحذ الحواف الواضحة فقط

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) {
            const center = copy[idx + c];
            const blur = (
              copy[((y - 1) * w + x) * 4 + c] +
              copy[((y + 1) * w + x) * 4 + c] +
              copy[(y * w + (x - 1)) * 4 + c] +
              copy[(y * w + (x + 1)) * 4 + c]
            ) * 0.25;

            const diff = center - blur;
                        const diff = center - blur;
            if (Math.abs(diff) > threshold) {
              src[idx + c] = Math.min(255, Math.max(0, center + diff * (amount * 2.2)));
            }
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function downloadImg() {
      const a = document.createElement('a');
      a.download = `SuperRes-${currentZoom}x-${Date.now()}.jpg`;
      a.href = document.getElementById('finalImage').src;
      a.click();
    }

    window.addEventListener('load', () => startCamera());
  </script>
</body>
</html>
